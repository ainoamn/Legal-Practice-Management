services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: legal
      POSTGRES_USER: legal_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-legal_dev_owner}
      APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-legal_dev_app}
      PLATFORM_PASSWORD: ${POSTGRES_PLATFORM_PASSWORD:-legal_dev_platform}
    ports: ["127.0.0.1:54329:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_owner -d legal"]
      interval: 5s
      retries: 12
  redis:
    image: redis:8-alpine
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:-legal_dev_redis}",
        "--appendonly",
        "yes",
      ]
    ports: ["127.0.0.1:63799:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a '${REDIS_PASSWORD:-legal_dev_redis}' ping | grep PONG",
        ]
      interval: 5s
      retries: 12
volumes:
  postgres_data:
  redis_data:
